<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,462&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

    <title>Paleta de Colores</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Mi Paleta de Colores</h1>

        <!-- CONTROLES -->
        <div class="controls">

            <!-- Modos -->
            <select id="modeSelect">
                <option value="random">Aleatorio</option>   <!--nueva opción -->
                <option value="complementary">Complementario</option>
                <option value="analogous">Análogo</option>
                <option value="triadic">Triádico</option>
                <option value="monochromatic">Monocromático</option>
            </select>

            <!-- Cantidad -->
            <select id="countSelect">
                <option value="6">6 colores</option>
                <option value="8" selected>8 colores</option>
                <option value="9">9 colores</option>
            </select>

            <!-- Formato -->
            <select id="formatSelect">
                <option value="hex">HEX</option>
                <option value="hsl">HSL</option>
                <option value="rgba">RGBA</option>
            </select>

            <!-- Botón -->
            <button onclick="generarAleatoria()">
                Generar Paleta
            </button>

                <!-- Botón Guardar -->
            <button onclick="guardarPaleta()" id="btnGuardar" disabled>
                Guardar Paleta
            </button>

        </div>

        <!-- CONTENEDOR DINÁMICO -->
        <div class="palette-container" id="paletteContainer"></div>

           <!-- PALETAS GUARDADAS -->
        <section id="savedSection" hidden>
            <h2 class="saved-title">Paletas Guardadas</h2>
            <div id="savedList"></div>
        </section>
 

        <!-- TOOLTIP -->
        <div id="tooltip" role="status" aria-live="polite" hidden></div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
