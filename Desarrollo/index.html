<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,462&family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

    <title>Paleta de Colores</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mi Paleta de Colores</h1>

    <!-- CONTROLES -->
    <div class="controls">

        <!-- Modos -->
        <select id="modeSelect">
            <option value="complementary">Complementario</option>
            <option value="analogous">Análogo</option>
            <option value="triadic">Triádico</option>
            <option value="monochromatic">Monocromático</option>
        </select>

        <!-- Cantidad -->
        <select id="countSelect">
            <option value="6">6 colores</option>
            <option value="8" selected>8 colores</option>
            <option value="9">9 colores</option>
        </select>

        <!-- Formato -->
        <select id="formatSelect">
            <option value="hex">HEX</option>
            <option value="hsl">HSL</option>
            <option value="rgba">RGBA</option>
        </select>

        <!-- Botón -->
        <button onclick="generarAleatoria()">
            Generar Paleta
        </button>

    </div>

    <!-- CONTENEDOR DINÁMICO -->
    <div class="palette-container" id="paletteContainer"></div>

    <!-- TOOLTIP -->
    <div id="tooltip" hidden></div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
